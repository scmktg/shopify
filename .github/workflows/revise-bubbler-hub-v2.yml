name: Revise bubbler hub v2

on:
  push:
    paths:
      - '.github/workflows/revise-bubbler-hub-v2.yml'

permissions:
  contents: write

jobs:
  update:
    if: github.event.head_commit.message == 'Run bubbler hub consolidation v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply bubbler hub revision
        run: |
          node <<'NODE'
          const fs = require('fs');
          const edit = (path, fn) => {
            const before = fs.readFileSync(path, 'utf8');
            const after = fn(before);
            if (after === before) console.log(`No change: ${path}`);
            else fs.writeFileSync(path, after);
          };

          edit('content/categories.ts', s => s.replace(
            "{ slug: 'bubblers', label: 'Bubblers' },",
            "{ slug: 'bubblers', label: 'Water Bubblers & Drinking Fountains' },"
          ));

          edit('content/category-intros.ts', s => s
            .replace(
              "'Commercial water bubblers and drinking fountains for schools, offices, gyms, warehouses, hospitality venues, and public facilities. Choose WaterMark-certified stainless-steel models with integrated filtration and chilled output for high-traffic installations. Square cabinets sit neatly against walls and corridors, while round profiles suit open public areas. All commercial models use serviceable filtration and standard plumbing connections for straightforward maintenance.'",
              "'Water bubblers and drinking fountains for Australian schools, offices, factories, warehouses, gyms, sporting facilities and public spaces. Compare stainless steel and rust-free cabinet options, mains-connected filtered drinking water, bottle-filling features and WaterMark-certified models. Choose the right drinking fountain by cabinet style, site requirements and verified model specifications.'"
            )
            .replace(
              "'Commercial water bubblers and drinking fountains in stainless steel. WaterMark-certified filtered and chilled models for schools, offices, gyms, warehouses and public venues.'",
              "'Water bubblers and drinking fountains for schools, offices, factories, warehouses, gyms and public facilities. Compare WaterMark-certified stainless steel and rust-free filtered models.'"
            )
          );

          edit('app/(shop)/[category]/[subcategory]/page.tsx', s => {
            s = s.replace("import { notFound } from 'next/navigation';", "import { notFound, permanentRedirect } from 'next/navigation';");
            const needle = "  const node = findSubcategory(category, subcategory);\n  if (!node) notFound();\n\n";
            if (s.includes(needle) && !s.includes("permanentRedirect('/commercial-water-bubblers')")) {
              s = s.replace(needle, needle + "  if (category === 'bubblers-and-coolers' && subcategory === 'bubblers') {\n    permanentRedirect('/commercial-water-bubblers');\n  }\n\n");
            }
            return s;
          });

          edit('app/commercial-water-bubblers/page.tsx', s => {
            const pairs = [
              ["Compact SUS304 cabinet for sheltered commercial locations.", "Round 304 stainless steel cabinet with direct mains connection and integrated filtration."],
              ["badge: 'Compact'", "badge: 'Stainless'"],
              ["highlights: ['20 L/hr', '8–12 °C', 'Filtered', 'WaterMark']", "highlights: ['304 stainless', 'Filtered', 'Direct mains', 'WaterMark']"],
              ["Rust-free, UV-stable cabinet for exposed outdoor locations.", "Rust-free HDPE cabinet with chilled, filtered drinking water."],
              ["badge: 'Outdoor'", "badge: 'Rust-free'"],
              ["round: 'SUS304 stainless steel'", "round: '304 stainless steel'"],
              ["round: '~95 cm'", "round: 'Not published'"],
              ["round: 'Ø ~30 cm'", "round: 'Not published'"],
              ["values: { round: '20 L/hr', square: '20 L/hr', hdpe: '20 L/hr' }", "values: { round: 'Not published', square: '20 L/hr', hdpe: '20 L/hr' }"],
              ["values: { round: '8–12 °C', square: '8–12 °C', hdpe: '8–12 °C' }", "values: { round: 'Not published', square: '8–12 °C', hdpe: '8–12 °C' }"],
              ["round: 'Sediment + carbon',\n      square: 'Sediment + carbon',\n      hdpe: 'Sediment + carbon'", "round: 'Integrated filtration cartridge',\n      square: 'Sediment + activated carbon',\n      hdpe: 'PP sediment + activated carbon'"],
              ["round: 'Indoor / sheltered',\n      square: 'Indoor / sheltered',\n      hdpe: 'Indoor / exposed outdoor'", "round: 'Commercial / institutional',\n      square: 'Commercial / institutional',\n      hdpe: 'Commercial / institutional'"],
              ["Commercial Water Bubblers Australia | WaterMark Certified", "Water Bubblers & Drinking Fountains Australia | Commercial & School"],
              ["Compare filtered commercial water bubblers and drinking fountains for Australian schools, offices, factories and gyms. WaterMark certified, chilled and mains connected.", "Shop water bubblers and drinking fountains for Australian schools, offices, factories, warehouses, gyms and public facilities. Compare filtered, chilled and WaterMark-certified models."],
              ["Commercial Water Bubblers Australia | Enviro Aqua", "Water Bubblers & Drinking Fountains Australia | Enviro Aqua"],
              ["A practical Australian guide to choosing commercial water bubblers for schools, offices, factories, gyms and public facilities.", "Compare water bubblers and drinking fountains for schools, offices, factories, warehouses, gyms and public facilities, with verified specifications for each model."],
              ["{ name: 'Commercial Water Bubblers', href: PATH }", "{ name: 'Water Bubblers & Drinking Fountains', href: PATH }"],
              ["Commercial Water Bubblers Australia", "Water Bubblers & Drinking Fountains Australia"],
              ["Filtered, chilled and WaterMark-certified commercial water bubblers for Australian schools, workplaces, factories, gyms and public facilities.", "Water bubblers and drinking fountains for Australian schools, workplaces, factories, warehouses, gyms and public facilities, with verified filtration, cooling and WaterMark information by model."],
              ["Australian commercial range", "Water bubblers & drinking fountains"],
              ["Commercial water bubblers for schools, workplaces and public spaces.", "Water bubblers & drinking fountains for schools, workplaces and public spaces."],
              ["Filtered, chilled, mains-connected drinking fountains with\n              WaterMark-certified options for indoor, sheltered and exposed\n              outdoor installations.", "Compare mains-connected drinking fountains and water bubblers with\n              filtered and chilled options, stainless steel or rust-free cabinets,\n              and WaterMark-certified models for Australian facilities."],
              ["All three Enviro Aqua commercial models provide 20 L/hr chilled\n              output at approximately 8–12 °C with sediment and carbon\n              filtration. Choose the cabinet based on location, exposure and\n              whether you need bottle filling.", "Choose by cabinet material, filtration, bottle-filling requirements and\n              verified cooling performance. The square stainless and rust-free\n              HDPE models are rated at 20 L/hr and approximately 8–12 °C.\n              Model-specific cooling figures for the round stainless unit are not\n              published until its technical documentation is confirmed."],
              ["All three Enviro Aqua commercial bubblers are rated at 20 L/hr.", "The square stainless and rust-free HDPE Enviro Aqua models are verified at 20 L/hr. The round stainless model’s capacity is not published here until model-specific documentation is confirmed."],
              ["Yes. The three commercial models use sediment and carbon filtration. The filters help reduce sediment and improve taste and odour before the water is chilled and dispensed.", "Yes. All three models include filtration. The square stainless model uses sediment plus activated carbon, the rust-free HDPE model uses PP sediment plus activated carbon, and the round stainless model has an integrated filtration cartridge."],
              ["Which water bubbler is best for outdoor use?", "Which water bubbler is best where a rust-free outer cabinet matters?"],
              ["For exposed outdoor locations, choose the rust-free HDPE granite model. The stainless-steel round and square models are better suited to indoor or sheltered positions. Site exposure, drainage, power and plumbing access should all be considered before installation.", "Choose the HDPE granite-look model where you specifically want a rust-free outer cabinet. Confirm the actual site conditions, drainage, power and plumbing access before ordering rather than assuming cabinet material alone determines location suitability."],
              ["Are replacement cartridges proprietary?", "What should I confirm before ordering replacement filters?"],
              ["No. These units use standard 10-inch filter housings, so replacement sediment and carbon cartridges are straightforward to source and maintain.", "Match replacements to the exact bubbler model and existing cartridge configuration. The square and rust-free models have verified sediment and activated-carbon stages; the round model uses an integrated filtration cartridge."],
              ["Use the HDPE model for exposed schoolyards; choose a stainless model for indoor or sheltered areas. The square and HDPE models also add a side tap for bottles.", "The square stainless and rust-free HDPE models add a side tap for bottle or glass filling, while the round stainless model is a simpler filtered drinking-fountain format. Confirm site conditions and installation requirements separately."],
              ["The HDPE model suits harsh or exposed areas; stainless models suit sheltered factory floors, lunchrooms and indoor production areas.", "The rust-free HDPE cabinet is useful where corrosion resistance is a priority, while the stainless models provide a clean commercial finish for workplace drinking-water stations."],
              ["['Compact stainless options', '20 L/hr cooling', 'Standard filter housings']", "['Compact stainless options', 'Mains-connected drinking water', 'Filtered options']"],
              ["['Rust-free outdoor option', 'Filtered chilled water', 'Multiple stations for large sites']", "['Rust-free HDPE option', 'Filtered drinking water', 'Multiple stations for large sites']"],
              ["['Bottle-fill models', '8–12 °C chilled output', 'Indoor and outdoor options']", "['Bottle-fill models', 'Chilled filtered options', 'Multiple cabinet styles']"]
            ];
            for (const [a,b] of pairs) s = s.split(a).join(b);
            return s;
          });
          NODE
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/categories.ts content/category-intros.ts 'app/(shop)/[category]/[subcategory]/page.tsx' app/commercial-water-bubblers/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'Reposition bubbler hub around drinking fountain intent'
          git push origin main
