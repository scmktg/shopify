name: Revise bubbler hub

on:
  push:
    paths:
      - '.github/workflows/revise-bubbler-hub.yml'

permissions:
  contents: write

jobs:
  update:
    if: github.event.head_commit.message == 'Run bubbler hub consolidation and keyword alignment'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Consolidate and revise bubbler hub
        run: |
          node <<'NODE'
          const fs = require('fs');

          function replaceOrFail(text, from, to, label) {
            if (!text.includes(from)) throw new Error(`Missing expected text: ${label}`);
            return text.replace(from, to);
          }

          // 1) Make the catalogue label reinforce the broad search concept.
          {
            const path = 'content/categories.ts';
            let s = fs.readFileSync(path, 'utf8');
            s = replaceOrFail(
              s,
              "{ slug: 'bubblers', label: 'Bubblers' },",
              "{ slug: 'bubblers', label: 'Water Bubblers & Drinking Fountains' },",
              'bubbler subcategory label',
            );
            fs.writeFileSync(path, s);
          }

          // 2) Broaden category copy and remove claims that over-generalise all models.
          {
            const path = 'content/category-intros.ts';
            let s = fs.readFileSync(path, 'utf8');
            s = replaceOrFail(
              s,
              "  'bubblers-and-coolers/bubblers':\n    'Commercial water bubblers and drinking fountains for schools, offices, gyms, warehouses, hospitality venues, and public facilities. Choose WaterMark-certified stainless-steel models with integrated filtration and chilled output for high-traffic installations. Square cabinets sit neatly against walls and corridors, while round profiles suit open public areas. All commercial models use serviceable filtration and standard plumbing connections for straightforward maintenance.',",
              "  'bubblers-and-coolers/bubblers':\n    'Water bubblers and drinking fountains for Australian schools, offices, factories, warehouses, gyms, sporting facilities and public spaces. Compare stainless steel and rust-free cabinet options, mains-connected filtered drinking water, bottle-filling features and WaterMark-certified models. Use this range to choose the right drinking fountain by cabinet style, site requirements and verified cooling or filtration specifications rather than relying on one generic commercial-bubbler description.',",
              'bubbler category intro',
            );
            s = replaceOrFail(
              s,
              "  'bubblers-and-coolers/bubblers':\n    'Commercial water bubblers and drinking fountains in stainless steel. WaterMark-certified filtered and chilled models for schools, offices, gyms, warehouses and public venues.',",
              "  'bubblers-and-coolers/bubblers':\n    'Water bubblers and drinking fountains for schools, offices, factories, warehouses, gyms and public facilities. Compare WaterMark-certified stainless steel and rust-free filtered models.',",
              'bubbler meta description',
            );
            fs.writeFileSync(path, s);
          }

          // 3) Permanently consolidate the thin generic collection into the rich hub.
          {
            const path = 'app/(shop)/[category]/[subcategory]/page.tsx';
            let s = fs.readFileSync(path, 'utf8');
            s = replaceOrFail(
              s,
              "import { notFound } from 'next/navigation';",
              "import { notFound, permanentRedirect } from 'next/navigation';",
              'navigation import',
            );
            s = replaceOrFail(
              s,
              "  const node = findSubcategory(category, subcategory);\n  if (!node) notFound();\n\n  const cartridgeFacetBySubcategory",
              "  const node = findSubcategory(category, subcategory);\n  if (!node) notFound();\n\n  // The rich bubbler hub owns the broad Water Bubblers & Drinking Fountains intent.\n  // Consolidate the thin catalogue URL so search engines and users see one category hub.\n  if (category === 'bubblers-and-coolers' && subcategory === 'bubblers') {\n    permanentRedirect('/commercial-water-bubblers');\n  }\n\n  const cartridgeFacetBySubcategory",
              'bubbler collection redirect',
            );
            fs.writeFileSync(path, s);
          }

          // 4) Reposition the rich hub around broad category intent and verified model facts.
          {
            const path = 'app/commercial-water-bubblers/page.tsx';
            let s = fs.readFileSync(path, 'utf8');

            const reps = [
              ["tagline: 'Compact SUS304 cabinet for sheltered commercial locations.',", "tagline: 'Round 304 stainless steel cabinet with direct mains connection and integrated filtration.',", 'round tagline'],
              ["badge: 'Compact',", "badge: 'Stainless',", 'round badge'],
              ["highlights: ['20 L/hr', '8–12 °C', 'Filtered', 'WaterMark'],", "highlights: ['304 stainless', 'Filtered', 'Direct mains', 'WaterMark'],", 'round highlights'],
              ["tagline: 'Rust-free, UV-stable cabinet for exposed outdoor locations.',", "tagline: 'Rust-free HDPE cabinet with chilled, filtered drinking water.',", 'hdpe tagline'],
              ["badge: 'Outdoor',", "badge: 'Rust-free',", 'hdpe badge'],
              ["round: 'SUS304 stainless steel',", "round: '304 stainless steel',", 'round material'],
              ["values: { round: '~95 cm', square: '99 cm', hdpe: '122 cm' },", "values: { round: 'Not published', square: '99 cm', hdpe: '122 cm' },", 'height'],
              ["values: { round: 'Ø ~30 cm', square: '30 × 30 cm', hdpe: '41 × 41 cm' },", "values: { round: 'Not published', square: '30 × 30 cm', hdpe: '41 × 41 cm' },", 'footprint'],
              ["values: { round: '20 L/hr', square: '20 L/hr', hdpe: '20 L/hr' },", "values: { round: 'Not published', square: '20 L/hr', hdpe: '20 L/hr' },", 'cooling'],
              ["values: { round: '8–12 °C', square: '8–12 °C', hdpe: '8–12 °C' },", "values: { round: 'Not published', square: '8–12 °C', hdpe: '8–12 °C' },", 'temperature'],
              ["round: 'Sediment + carbon',\n      square: 'Sediment + carbon',\n      hdpe: 'Sediment + carbon',", "round: 'Integrated filtration cartridge',\n      square: 'Sediment + activated carbon',\n      hdpe: 'PP sediment + activated carbon',", 'filtration'],
              ["round: 'Indoor / sheltered',\n      square: 'Indoor / sheltered',\n      hdpe: 'Indoor / exposed outdoor',", "round: 'Commercial / institutional',\n      square: 'Commercial / institutional',\n      hdpe: 'Commercial / institutional',", 'location'],
              ["title: 'Commercial Water Bubblers Australia | WaterMark Certified',", "title: 'Water Bubblers & Drinking Fountains Australia | Commercial & School',", 'metadata title'],
              ["'Compare filtered commercial water bubblers and drinking fountains for Australian schools, offices, factories and gyms. WaterMark certified, chilled and mains connected.',", "'Shop water bubblers and drinking fountains for Australian schools, offices, factories, warehouses, gyms and public facilities. Compare filtered, chilled and WaterMark-certified models.',", 'metadata description'],
              ["title: 'Commercial Water Bubblers Australia | Enviro Aqua',", "title: 'Water Bubblers & Drinking Fountains Australia | Enviro Aqua',", 'og title'],
              ["'A practical Australian guide to choosing commercial water bubblers for schools, offices, factories, gyms and public facilities.',", "'Compare water bubblers and drinking fountains for schools, offices, factories, warehouses, gyms and public facilities, with verified specifications for each model.',", 'og description'],
              ["{ name: 'Commercial Water Bubblers', href: PATH },", "{ name: 'Water Bubblers & Drinking Fountains', href: PATH },", 'breadcrumb'],
              ["'Commercial Water Bubblers Australia',", "'Water Bubblers & Drinking Fountains Australia',", 'collection name'],
              ["'Filtered, chilled and WaterMark-certified commercial water bubblers for Australian schools, workplaces, factories, gyms and public facilities.',", "'Water bubblers and drinking fountains for Australian schools, workplaces, factories, warehouses, gyms and public facilities, with verified filtration, cooling and WaterMark information by model.',", 'collection description'],
              ["Australian commercial range", "Water bubblers & drinking fountains", 'hero badge'],
              ["Commercial water bubblers for schools, workplaces and public spaces.", "Water bubblers & drinking fountains for schools, workplaces and public spaces.", 'h1'],
              ["Filtered, chilled, mains-connected drinking fountains with\n              WaterMark-certified options for indoor, sheltered and exposed\n              outdoor installations.", "Compare mains-connected drinking fountains and water bubblers with\n              filtered and chilled options, stainless steel or rust-free cabinets,\n              and WaterMark-certified models for Australian facilities.", 'hero intro'],
              ["All three Enviro Aqua commercial models provide 20 L/hr chilled\n              output at approximately 8–12 °C with sediment and carbon\n              filtration. Choose the cabinet based on location, exposure and\n              whether you need bottle filling.", "Choose by the facts that matter at your site: cabinet material,\n              filtration, bottle-filling requirements and verified cooling\n              performance. The square stainless and rust-free HDPE models are\n              rated at 20 L/hr and approximately 8–12 °C; model-specific cooling\n              figures for the round stainless unit are not published until its\n              technical documentation is confirmed.", 'hero verified comparison'],
              ["a: 'Cooling capacity is measured in litres per hour, but the right capacity depends on peak demand rather than just the total number of people at a site. All three Enviro Aqua commercial bubblers are rated at 20 L/hr. For unusually high peak demand or multiple simultaneous users, consider more than one station rather than relying on a single unit.',", "a: 'Cooling capacity is measured in litres per hour, but the right capacity depends on peak demand rather than just total headcount. The square stainless and rust-free HDPE Enviro Aqua models are verified at 20 L/hr. The round stainless model’s capacity is not published here until model-specific documentation is confirmed. For unusually high peak demand, consider more than one station.',", 'capacity faq'],
              ["a: 'Yes. The three commercial models use sediment and carbon filtration. The filters help reduce sediment and improve taste and odour before the water is chilled and dispensed.',", "a: 'Yes. All three models include filtration. The square stainless model uses sediment plus activated carbon, the rust-free HDPE model uses PP sediment plus activated carbon, and the round stainless model has an integrated filtration cartridge. We do not publish more specific media claims for the round model until its technical documentation is confirmed.',", 'filter faq'],
              ["q: 'Which water bubbler is best for outdoor use?',\n    a: 'For exposed outdoor locations, choose the rust-free HDPE granite model. The stainless-steel round and square models are better suited to indoor or sheltered positions. Site exposure, drainage, power and plumbing access should all be considered before installation.',", "q: 'Which water bubbler is best where a rust-free outer cabinet matters?',\n    a: 'Choose the HDPE granite-look model where you specifically want a rust-free outer cabinet. For any installation, confirm the site conditions, drainage, power and plumbing access before ordering rather than assuming cabinet material alone determines location suitability.',", 'outdoor faq'],
              ["q: 'Are replacement cartridges proprietary?',\n    a: 'No. These units use standard 10-inch filter housings, so replacement sediment and carbon cartridges are straightforward to source and maintain.',", "q: 'What should I confirm before ordering replacement filters?',\n    a: 'Match replacements to the exact bubbler model and existing cartridge configuration. The square and rust-free models have verified sediment and activated-carbon stages; the round model uses an integrated filtration cartridge, so confirm its current cartridge specification before ordering a replacement.',", 'replacement filter faq'],
              ["a: 'Choose a WaterMark-certified, lead-free, robust unit that suits the exposure level. Use the HDPE model for exposed schoolyards; choose a stainless model for indoor or sheltered areas. The square and HDPE models also add a side tap for bottles.',", "a: 'Choose a WaterMark-certified, lead-free unit that matches the way students will use it. The square stainless and rust-free HDPE models include a side tap for bottle or glass filling; the round stainless model is a simpler filtered drinking-fountain format. Confirm site conditions and installation requirements separately.',", 'school answer'],
              ["a: 'Prioritise durability, easy cleaning and access during shift peaks. The HDPE model suits harsh or exposed areas; stainless models suit sheltered factory floors, lunchrooms and indoor production areas.',", "a: 'Prioritise cabinet durability, easy cleaning, plumbing access and peak-shift demand. The rust-free HDPE cabinet is useful where corrosion resistance is a priority, while the stainless models provide a clean commercial finish for workplace drinking-water stations.',", 'factory answer'],
              ["points: ['Compact stainless options', '20 L/hr cooling', 'Standard filter housings'],", "points: ['Compact stainless options', 'Mains-connected drinking water', 'Filtered options'],", 'office use case'],
              ["points: ['Rust-free outdoor option', 'Filtered chilled water', 'Multiple stations for large sites'],", "points: ['Rust-free HDPE option', 'Filtered drinking water', 'Multiple stations for large sites'],", 'factory use case'],
              ["points: ['Bottle-fill models', '8–12 °C chilled output', 'Indoor and outdoor options'],", "points: ['Bottle-fill models', 'Chilled filtered options', 'Multiple cabinet styles'],", 'gym use case'],
            ];

            for (const [from, to, label] of reps) s = replaceOrFail(s, from, to, label);
            fs.writeFileSync(path, s);
          }
          NODE

      - name: Validate changes
        run: |
          node -e "JSON.parse(require('fs').readFileSync('data/products.json','utf8')); console.log('products.json valid')"
          npx tsc --noEmit

      - name: Commit hub revision
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/categories.ts content/category-intros.ts 'app/(shop)/[category]/[subcategory]/page.tsx' app/commercial-water-bubblers/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'Reposition bubbler hub around drinking fountain intent'
          git push origin main
